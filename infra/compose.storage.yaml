services:
  minio:
    build:
      context: ./infra/minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${ERP_STORAGE_ACCESS_KEY:?Set ERP_STORAGE_ACCESS_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${ERP_STORAGE_CORS_ORIGIN:-http://localhost:8080}
      MINIO_ROOT_PASSWORD: ${ERP_STORAGE_SECRET_KEY:?Set ERP_STORAGE_SECRET_KEY}
    ports:
      - "127.0.0.1:${ERP_STORAGE_LOCAL_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    environment:
      ERP_STORAGE_PROVIDER: minio
      ERP_STORAGE_REGION: us-east-1
      ERP_STORAGE_ENDPOINT: http://minio:9000
      ERP_STORAGE_PUBLIC_ENDPOINT: ${ERP_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      ERP_STORAGE_BUCKET: ${ERP_STORAGE_BUCKET:?Set ERP_STORAGE_BUCKET}
      ERP_STORAGE_ACCESS_KEY: ${ERP_STORAGE_ACCESS_KEY:?Set ERP_STORAGE_ACCESS_KEY}
      ERP_STORAGE_SECRET_KEY: ${ERP_STORAGE_SECRET_KEY:?Set ERP_STORAGE_SECRET_KEY}
      ERP_CLAMD_HOST: ${ERP_CLAMD_HOST:-}
      ERP_PUBLIC_BRAND_COMPANY_ID: ${ERP_PUBLIC_BRAND_COMPANY_ID:-}
volumes:
  minio-data:

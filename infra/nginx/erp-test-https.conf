server {
    listen 443 ssl;
    server_name erp.yiheit.net;
    if ($host != erp.yiheit.net) { return 421; }
    ssl_certificate /etc/letsencrypt/live/erp.yiheit.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.yiheit.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    proxy_set_header Host erp.yiheit.net;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    location = /api/health { proxy_pass http://127.0.0.1:18000/health; }
    location = /api/ready { proxy_pass http://127.0.0.1:18000/ready; }
    location /api/ { proxy_pass http://127.0.0.1:18000; }
    location / { proxy_pass http://127.0.0.1:13000; }
}

resolver 127.0.0.11 valid=5s ipv6=off;

map $http_x_request_id $erp_request_id {
    default $request_id;
    "~^(?![0-9]{12,}$)[A-Za-z0-9][A-Za-z0-9_-]{0,63}$" $http_x_request_id;
}

map $upstream_http_x_request_id $erp_response_id {
    "" $erp_request_id;
    default $upstream_http_x_request_id;
}

log_format erp_trace escape=json
    '{"time":"$time_iso8601","trace_id":"$erp_response_id","status_code":$status,'
    '"duration_seconds":$request_time}';

upstream erp_api {
    zone erp_api 64k;
    server api:8000 resolve;
}

upstream erp_web {
    zone erp_web 64k;
    server web:3000 resolve;
}

server {
    listen 8080;
    server_name localhost;
    access_log /dev/stdout erp_trace;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $erp_request_id;
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $erp_response_id always;

    location /api/ {
        proxy_pass http://erp_api/;
    }

    location / {
        proxy_pass http://erp_web;
    }
}

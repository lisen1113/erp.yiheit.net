name: Deploy ERP test

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full SHA of the reviewed deployment commit
        type: string
        required: true
      bootstrap_https:
        description: Create the ERP virtual host and certificate on a fresh test host
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: yihe-erp-test-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - name: Verify exact ref, SHA and successful CI
        id: gate
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/codex/t011-test-deployment) ;;
            *) exit 1 ;;
          esac
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch "$GITHUB_REF_NAME" --event push --commit "$GITHUB_SHA" \
            --json conclusion --jq 'any(.[]; .conclusion == "success")' | grep -qx true
          echo 'approved=true' >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify
    if: needs.verify.outputs.approved == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/t011-test-deployment')
    runs-on: ${{ vars.TEST_RUNNER_LABEL || 'yihe-erp-test' }}
    environment: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Build and deploy the verified release
        env:
          TEST_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_USER: ${{ secrets.TEST_SSH_USER }}
          TEST_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          TEST_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          BOOTSTRAP_HTTPS: ${{ inputs.bootstrap_https }}
          ACME_EMAIL: ${{ vars.TEST_ACME_EMAIL }}
        run: bash scripts/dispatch-test-release.sh

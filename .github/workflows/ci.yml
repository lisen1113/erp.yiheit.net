name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.9'
      - run: uv sync --frozen --all-packages
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm contracts:check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked source for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source /repo --no-git --redact
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker development environment
        run: bash infra/verify-compose.sh
      - name: Validate T011 test deployment configuration
        run: |
          bash -n scripts/deploy-test.sh
          bash -n scripts/t011-a1-bootstrap-http.sh
          bash -n scripts/bootstrap-test-release.sh
          bash -n scripts/dispatch-test-release.sh
          bash -n scripts/smoke-test-storage.sh
          python -c "import ast; from pathlib import Path; ast.parse(Path('scripts/smoke-test-https.py').read_text())"
          bash -n scripts/backup-test.sh
          bash -n scripts/restore-test.sh
          bash -n scripts/retain-test-backups.sh
          bash -n infra/nginx/certbot-erp-reload.sh
          export ERP_ENV=test POSTGRES_DB=yihe_erp_seed_ci POSTGRES_USER=erp_ci
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export ERP_TEST_ENV_FILE="$(mktemp)"
          export ERP_TEST_STORAGE_ENV_FILE="$ERP_TEST_ENV_FILE"
          export ERP_POSTGRES_IMAGE=postgres:16-bookworm ERP_REDIS_IMAGE=redis:7-bookworm
          export ERP_API_IMAGE=erp-api:ci ERP_WEB_IMAGE=erp-web:ci ERP_WORKER_IMAGE=erp-worker:ci
          export ERP_MINIO_IMAGE=erp-minio:ci ERP_CLAMAV_IMAGE=erp-clamav:ci
          trap 'rm -f "$ERP_TEST_ENV_FILE"' EXIT
          docker compose -f infra/compose.test.yaml --profile '*' config --quiet
          docker compose -f infra/compose.test.yaml -f infra/compose.test.storage.yaml config --quiet
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: t003_verify
      POSTGRES_USER: t003_verify
      COMPOSE_PROJECT_NAME: t003-migrations
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.9'
      - run: uv sync --frozen --all-packages
      - name: Audit locked Python dependencies
        run: uv audit --locked
      - name: Start isolated PostgreSQL 16
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_ENV"
          docker compose -p "$COMPOSE_PROJECT_NAME" up -d --wait postgres
          container=$(docker compose -p "$COMPOSE_PROJECT_NAME" ps -q postgres)
          host=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container")
          echo "POSTGRES_HOST=$host" >> "$GITHUB_ENV"
      - name: Verify empty database, rollback, re-upgrade and database contracts
        run: uv run --frozen pytest -v -s apps/api/integration/test_postgres_migrations.py apps/api/integration/test_authentication.py apps/api/integration/test_authorization.py apps/api/integration/test_audit.py apps/api/integration/test_idempotency.py apps/api/integration/test_business_partners.py --tb=short
      - name: Verify Alembic from the Compose API image
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f compose.yaml -f infra/compose.migrations.yaml run --rm --no-deps --build api alembic check
      - name: Verify T010 seed on a new isolated database
        env:
          ERP_ENV: test
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" exec -T postgres createdb -U "$POSTGRES_USER" yihe_erp_seed_ci
          export POSTGRES_DB=yihe_erp_seed_ci
          export ERP_SEED_TEST_DB_HOST="$POSTGRES_HOST"
          uv run --frozen alembic -c apps/api/alembic.ini upgrade head
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          export ERP_SEED_DEFAULT_PASSWORD="$password"
          for action in seed-dev seed-reset; do
            if ERP_ENV=production uv run --frozen python -m yihe_api.cli "$action"; then
              echo "Production command unexpectedly succeeded: $action"
              exit 1
            fi
          done
          uv run --frozen python -m yihe_api.cli seed-dev
          uv run --frozen python -m yihe_api.cli seed-dev
          uv run --frozen python -m yihe_api.cli seed-reset
          uv run --frozen python scripts/seed/validate_fixtures.py
          uv run --frozen pytest -q -s apps/api/integration/test_dev_seed.py --tb=short
      - name: Start and recreate versioned MinIO
        run: |
          secret=$(openssl rand -hex 24)
          echo "::add-mask::$secret"
          export ERP_STORAGE_SECRET_KEY="$secret"
          export ERP_STORAGE_ACCESS_KEY=ci-file-probe
          export ERP_STORAGE_BUCKET=erp-file-test
          export ERP_STORAGE_PROVIDER=minio
          export ERP_STORAGE_REGION=us-east-1
          export ERP_STORAGE_ENDPOINT=http://127.0.0.1:9000
          echo "ERP_STORAGE_SECRET_KEY=$ERP_STORAGE_SECRET_KEY" >> "$GITHUB_ENV"
          echo "ERP_STORAGE_ACCESS_KEY=$ERP_STORAGE_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "ERP_STORAGE_BUCKET=$ERP_STORAGE_BUCKET" >> "$GITHUB_ENV"
          echo "ERP_STORAGE_PROVIDER=$ERP_STORAGE_PROVIDER" >> "$GITHUB_ENV"
          echo "ERP_STORAGE_REGION=$ERP_STORAGE_REGION" >> "$GITHUB_ENV"
          echo "ERP_STORAGE_ENDPOINT=$ERP_STORAGE_ENDPOINT" >> "$GITHUB_ENV"
          bash infra/verify-storage.sh
      - name: Verify file security with PostgreSQL and MinIO
        run: uv run --frozen pytest -v -s apps/api/integration/test_file_storage.py --tb=short
      - name: Remove disposable object store
        if: always()
        run: |
          if [ -n "${ERP_STORAGE_SECRET_KEY:-}" ]; then
            docker compose -p t009-storage -f compose.yaml -f infra/compose.storage.yaml down --volumes
          fi
      - name: Remove disposable migration database
        if: always()
        run: |
          if [ -n "${POSTGRES_PASSWORD:-}" ]; then
            docker compose -p "$COMPOSE_PROJECT_NAME" down --volumes
          fi

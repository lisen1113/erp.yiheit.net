[project]
name = "yihe-erp-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.121,<1", "pydantic>=2.12,<3", "uvicorn>=0.38,<1", "sqlalchemy>=2,<3", "alembic>=1.17,<2", "psycopg[binary]>=3.2,<4"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yihe_api"]
